server:
  port: 8080


env:
  type: tst

spring:
  application:
    name: mybatis-plus


management:
  endpoints:
    web:
      exposure:
          include: health,info,prometheus,metrics,mappings
      base-path: /actuator
  # 开启 prometheus 端点
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name} #  Prometheus 指标tag
    export:
      prometheus:
          enabled: true # 启用 Prometheus 指标导出